version = 1
SPDX-PackageName = "seerdb"
SPDX-PackageSupplier = "Peter Lemenkov <lemenkov@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/seerdb/seerdb"

[[annotations]]
path = ["README.md", "ROADMAP.md", "docs/PROTOCOL.md", "CONTRIBUTING.md", "ChangeLog", "AGENTS.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2019-2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["tests/fixtures/proxy_cert.pem", "tests/fixtures/proxy_key.pem"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# Wallet mTLS fixture (#127), regenerated by tests/fixtures/make_wallet_fixture.py.
# Test-only certificates / keys / Oracle Net config; no inline SPDX tags possible.
path = ["tests/fixtures/wallet/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# PEP 561 marker; conventionally empty so it carries no inline SPDX tag. Trivial
# (empty) file, so CC0-1.0 like the repo's other config.
path = ["seerdb/py.typed"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
# Captured ANO negotiation response from a real Oracle server (#437), test data.
path = ["tests/fixtures/ano_server_response.bin"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC0-1.0"

# The project mark. Image files cannot carry an inline SPDX header, so they are
# annotated here. The mark is content rather than code and is licensed
# CC-BY-ND-4.0: it may be redistributed freely to refer to the project, but not
# altered into a variant brand. Note that CC-BY-ND is allowed for content in
# Fedora but is not DFSG-free, so a Debian package would strip or repack these
# files; revisit the licence if that request ever arrives.
[[annotations]]
path = ["assets/*.svg", "assets/*.png"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "CC-BY-ND-4.0"

# The accompanying documentation is ordinary prose, not the mark, so it stays MIT.
[[annotations]]
path = ["assets/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Peter Lemenkov <lemenkov@gmail.com>"
SPDX-License-Identifier = "MIT"
